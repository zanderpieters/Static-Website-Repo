<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" 
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link href="style.css" rel="stylesheet">
        <title>Shopping Page</title>
</head>
<body>
    <!-- products -->
    <div class="container my-4">
        <h1 class="text-center mb-4">Our Products</h1>
        <div class="row">

            <!-- 1 -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <img src="banana.webp" class="card-img-top img-fluid product-img" alt="Product 1">
                    <div class="card-body text-center">
                        <h2 class="card-title">Bananas</h2>
                        <p class="card-text">R 29.99</p>
                        <button class="btn btn-primary">Buy</button>
                    </div>
                </div>
            </div>

            <!-- 2 -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <img src="eggs.webp" class="card-img-top img-fluid product-img" alt="Product 2">
                    <div class="card-body text-center">
                        <h2 class="card-title">eggs</h2>
                        <p class="card-text">R 49.99</p>
                        <button class="btn btn-primary">Buy</button>
                    </div>
                </div>
            </div>

            <!-- 3 -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <img src="aromat.webp" class="card-img-top img-fluid product-img" alt="Product 3">
                    <div class="card-body text-center">
                        <h2 class="card-title">aromat</h2>
                        <p class="card-text">R 49.99</p>
                        <button class="btn btn-primary">Buy</button>
                    </div>
                </div>
            </div>

            <!-- 4 -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <img src="avocados.jpg" class="card-img-top img-fluid product-img" alt="Product 4">
                    <div class="card-body text-center">
                        <h2 class="card-title">avocados</h2>
                        <p class="card-text">R 99.99</p>
                        <button class="btn btn-primary">Buy</button>
                    </div>
                </div>
            </div>

            <!-- 5 -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <img src="chicken.webp" class="card-img-top img-fluid product-img" alt="Product 5">
                    <div class="card-body text-center">
                        <h2 class="card-title">chicken fillets</h2>
                        <p class="card-text">R 109.99</p>
                        <button class="btn btn-primary">Buy</button>
                    </div>
                </div>
            </div>

            <!-- 6 -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <img src="mayo.webp" class="card-img-top img-fluid product-img" alt="Product 6">
                    <div class="card-body text-center">
                        <h2 class="card-title">mayo</h2>
                        <p class="card-text">R 79.99</p>
                        <button class="btn btn-primary">Buy</button>
                    </div>
                </div>
            </div>

            <!-- 7 -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <img src="milk.webp" class="card-img-top img-fluid product-img" alt="Product 7">
                    <div class="card-body text-center">
                        <h2 class="card-title">milk</h2>
                        <p class="card-text">R 69.99</p>
                        <button class="btn btn-primary">Buy</button>
                    </div>
                </div>
            </div>

            <!-- 8 -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <img src="mince.webp" class="card-img-top img-fluid product-img" alt="Product 8">
                    <div class="card-body text-center">
                        <h2 class="card-title">mince</h2>
                        <p class="card-text">R 89.99</p>
                        <button class="btn btn-primary">Buy</button>
                    </div>
                </div>
            </div>

            <!-- 9 -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <img src="noodles.webp" class="card-img-top img-fluid product-img" alt="Product 9">
                    <div class="card-body text-center">
                        <h2 class="card-title">noodles</h2>
                        <p class="card-text">R 49.99</p>
                        <button class="btn btn-primary">Buy</button>
                    </div>
                </div>
            </div>

            <!-- 10 -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <img src="tomatos.png" class="card-img-top img-fluid product-img" alt="Product 10">
                    <div class="card-body text-center">
                        <h2 class="card-title">tomatos</h2>
                        <p class="card-text">R 59.99</p>
                        <button class="btn btn-primary">Buy</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- footer -->
    <footer class="bg-light py-4 mt-4">
        <div class="container">
            <div class="row align-items-center">

                <!-- company logo -->
                <div class="col-md-3 text-center mb-3 mb-md-0">
                    <img src="spar.webp" class="img-fluid" alt="Company Logo">
                </div>

                <!-- contact form -->
                <div class="col-md-9">
                    <h5>Contact Us</h5>
                    <form class="row g-3">
                        <div class="col-md-4">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" placeholder="Your name">
                        </div>
                        <div class="col-md-4">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="Your email">
                        </div>
                        <div class="col-md-4">
                            <label for="phone" class="form-label">Phone</label>
                            <input type="tel" class="form-control" id="phone" placeholder="Your phone number">
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary">Submit</button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </footer>    
</body>
</html>
